<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Communicator Playground</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Communicator Playground</h1>
      <p data-i18n="app.tagline"></p>
    </div>
    <div class="top-right">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="customize" aria-selected="true" data-i18n="tab.customize"></button>
        <button type="button" role="tab" data-tab="simulate" aria-selected="false" data-i18n="tab.simulate"></button>
      </nav>
      <label class="lang-select">
        <span class="visually-hidden" data-i18n="lang.label"></span>
        <select id="lang" data-i18n-aria="lang.label"></select>
      </label>
    </div>
  </header>

  <main>
    <section id="tab-customize" class="view">
      <div class="stage draggable" id="customize-stage">
        <p class="stage-hint" data-i18n="stage.drag"></p>
      </div>
      <aside class="panel">
        <h2 data-i18n="h.view"></h2>
        <div class="row">
          <button type="button" class="btn" id="view-front" data-i18n="view.front"></button>
          <button type="button" class="btn" id="view-back" data-i18n="view.back"></button>
          <button type="button" class="btn" id="view-left" data-i18n="view.left"></button>
          <button type="button" class="btn" id="view-right" data-i18n="view.right"></button>
          <button type="button" class="btn" id="view-top" data-i18n="view.top"></button>
          <button type="button" class="btn" id="view-spin" data-i18n="view.spin"></button>
        </div>

        <h2 data-i18n="h.body"></h2>
        <div class="swatches" id="body-swatches"></div>
        <p class="picked" id="body-picked"></p>

        <h2 data-i18n="h.cover"></h2>
        <div class="swatches" id="cover-swatches"></div>
        <p class="picked" id="cover-picked"></p>
        <p class="note" data-i18n="note.covers"></p>

        <h2 data-i18n="h.layout"></h2>
        <select id="kb-layout"></select>

        <h2 data-i18n="h.acc"></h2>
        <div id="accessories"></div>

        <h2 data-i18n="h.summary"></h2>
        <ul class="summary" id="config-summary"></ul>
        <div class="row">
          <button type="button" class="btn" id="share-link" data-i18n="share.copy"></button>
          <button type="button" class="btn primary" id="order-btn" disabled data-i18n="order.soon"></button>
        </div>
        <p class="note" id="share-status" aria-live="polite"></p>
        <p class="note" data-i18n="note.colors"></p>
      </aside>
    </section>

    <section id="tab-simulate" class="view" hidden>
      <div class="stage" id="simulate-stage">
        <p class="stage-hint" data-i18n="stage.sim"></p>
      </div>
      <aside class="panel">
        <h2 data-i18n="h.content"></h2>
        <label class="check"><input type="radio" name="sim-mode" value="mock" checked> <span data-i18n="mode.mock"></span></label>
        <label class="check"><input type="radio" name="sim-mode" value="url"> <span data-i18n="mode.url"></span></label>
        <form class="url-form" id="sim-url-form" hidden>
          <input type="url" id="sim-url" placeholder="http://localhost:3000" required>
          <button type="submit" class="btn" data-i18n="url.show"></button>
          <p class="note" data-i18n="url.note"></p>
        </form>

        <h2 data-i18n="h.screen"></h2>
        <label class="field"><span data-i18n="sim.density"></span>
          <select id="sim-density">
            <option value="400">400 dpi</option>
            <option value="420" selected data-i18n="density.est"></option>
            <option value="440">440 dpi</option>
            <option value="480">480 dpi</option>
          </select>
        </label>
        <label class="field"><span data-i18n="sim.font"></span>
          <select id="sim-font">
            <option value="1" selected data-i18n="font.normal"></option>
            <option value="1.15" data-i18n="font.large"></option>
            <option value="1.3" data-i18n="font.max"></option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="sim-safe"> <span data-i18n="sim.safe"></span></label>
        <p class="note"><span data-i18n="sim.area"></span> <strong id="sim-info"></strong></p>

        <h2 data-i18n="h.notify"></h2>
        <div class="row" id="sim-notify"></div>

        <h2 data-i18n="h.keys"></h2>
        <label class="field"><span data-i18n="clicks.label"></span>
          <select id="sim-clicks">
            <option value="notes" data-i18n="clicks.notes"></option>
            <option value="unread" data-i18n="clicks.unread"></option>
            <option value="hub" data-i18n="clicks.hub"></option>
          </select>
        </label>
        <div class="row">
          <button type="button" class="btn" id="sim-voice" data-i18n="sim.voice"></button>
          <button type="button" class="btn" id="sim-reset" data-i18n="sim.reset"></button>
        </div>

        <h2 data-i18n="h.tips"></h2>
        <ul class="note tips">
          <li data-i18n="tip.lock"></li>
          <li data-i18n="tip.hub"></li>
          <li data-i18n="tip.chat"></li>
          <li data-i18n="tip.scroll"></li>
          <li data-i18n="tip.mods"></li>
          <li data-i18n="tip.kill"></li>
          <li data-i18n="tip.voice"></li>
        </ul>
      </aside>
    </section>
  </main>

  <footer data-i18n="footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/device.js"></script>
  <script src="js/customizer.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
